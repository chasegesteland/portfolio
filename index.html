        body {

            color: var(--text-color);

            padding: 0;

            max-width: 600px;
            margin: 60px auto 20px auto;
            padding: 0 5%;
        }

        p {
            font-family: ui-monospace, Menlo, Monaco, "Cascadia Mono", monospace;
            line-height: 1.6;
            font-size: 1rem;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
        }
